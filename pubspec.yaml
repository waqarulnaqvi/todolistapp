name: todolistapp
description: A modern Flutter To-Do application with reminders, filters, and offline support.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Layout
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  flutter_screenutil: ^5.9.3
  dropdown_button2: ^2.3.9
  font_awesome_flutter: ^10.12.0
  lottie: ^3.3.2
  flutter_icon_snackbar: ^1.2.1

  # State Management / Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_hooks: ^0.21.3+1
  get_it: ^9.2.0

  # Storage / Persistence
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Reminders / Notifications
  flutter_local_notifications: ^19.5.0
  android_alarm_manager_plus: ^5.0.0
  permission_handler: ^12.0.1

  # Utilities
  url_launcher: ^6.3.2
  logger: ^2.6.2
  flutter_datetime_picker_plus: ^2.2.0

  # App Icons
  icons_launcher: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animation/lottie/

icons_launcher:
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_maskable: true
  platforms:
    android:
      enable: true
    ios:
      enable: true
