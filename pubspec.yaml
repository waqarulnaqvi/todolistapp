name: todolistapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  dropdown_button2: ^2.3.9
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  icons_launcher: ^3.0.3
  font_awesome_flutter: ^10.12.0
  path_provider: ^2.1.5
  flutter_screenutil: ^5.9.3
  flutter_hooks: ^0.21.3+1
  lottie: ^3.3.2
  flutter_icon_snackbar: ^1.2.1
  url_launcher: ^6.3.2
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^5.1.0           # Industry-standard linting rules

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animation/lottie/

icons_launcher:
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_maskable: true
  platforms:
    android:
      enable: true
    ios:
      enable: true